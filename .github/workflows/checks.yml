name: Checks

on:
  push:
    branches-ignore:
      - main
  # pull_request:
  #   branches:
  #     - main

permissions:
  contents: read

jobs:
  checks:
    name: Android and Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test SDK installer
        run: python3 -B -m unittest discover -s scripts/tests

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: python3 scripts/install-android-sdk.py

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup target add --toolchain 1.98 aarch64-linux-android x86_64-linux-android

      - name: Run unit tests and lint
        run: |
          chmod +x ./gradlew
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Run Rust tests
        run: cargo +1.98 test --locked --manifest-path native/Cargo.toml
