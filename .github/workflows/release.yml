name: Release

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test YouTube player filtering
        run: node --test scripts/tests/youtube-player.test.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle with download retries
        run: bash scripts/prepare-gradle.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: python3 scripts/install-android-sdk.py

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup target add --toolchain 1.98 aarch64-linux-android x86_64-linux-android

      - name: Run Rust tests
        run: cargo +1.98 test --locked --manifest-path native/Cargo.toml

      - name: Increment release version
        id: version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")
          text = gradle_file.read_text()

          code_match = re.search(r"(?m)^(\s*)versionCode = (\d+)\s*$", text)
          name_match = re.search(r'(?m)^(\s*)versionName = "(\d+)\.(\d+)\.(\d+)"\s*$', text)
          if code_match is None or name_match is None:
              raise SystemExit("Expected numeric versionCode and semantic versionName in app/build.gradle.kts")

          version_code = int(code_match.group(2)) + 1
          major, minor, patch = (int(name_match.group(i)) for i in (2, 3, 4))
          version_name = f"{major}.{minor}.{patch + 1}"

          text = text[:code_match.start()] + f"{code_match.group(1)}versionCode = {version_code}" + text[code_match.end():]
          name_match = re.search(r'(?m)^(\s*)versionName = "\d+\.\d+\.\d+"\s*$', text)
          text = text[:name_match.start()] + f'{name_match.group(1)}versionName = "{version_name}"' + text[name_match.end():]
          gradle_file.write_text(text)

          tag = f"v{version_name}"
          apk_name = f"StreamShield-{tag}.apk"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version_code={version_code}\n")
              output.write(f"version_name={version_name}\n")
              output.write(f"tag={tag}\n")
              output.write(f"apk_name={apk_name}\n")
              output.write(f"apk_path=app/build/outputs/apk/release/{apk_name}\n")

      - name: Run checks and build release APK
        run: |
          chmod +x ./gradlew
          bash ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleRelease

      - name: Sign release APK
        env:
          RELEASE_APK: ${{ steps.version.outputs.apk_path }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi

          keystore="$RUNNER_TEMP/release.keystore"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RELEASE_APK" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/apksigner" verify --verbose "$RELEASE_APK"

      - name: Create APK checksum
        working-directory: app/build/outputs/apk/release
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Commit version and create tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): ${RELEASE_TAG}"
          git tag "${RELEASE_TAG}"
          git push --atomic origin HEAD:main "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.version.outputs.apk_path }}
            ${{ steps.version.outputs.apk_path }}.sha256
