[package]
name = "streamshield-adblock"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[lib]
name = "streamshield_adblock"
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { path = "../vendor/adblock-rust-master", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "0.21.1"
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
